<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Battle - Wiggly Moustache</title>
    <style>
      body {
        background: #f5d6b4;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      div {
        width: 60px;
        position: relative;
      }
      #middle {
        height: 30px;
        border: 20px solid #d86f45;
        border-top-left-radius: 100px;
        border-top-right-radius: 100px;
        border-bottom: 0;
        bottom: 24px;
      }
    </style>
  </head>
  <body>
    <div id="leftDot"></div>
    <div id="left"></div>
    <div id="middle"></div>
    <div id="right"></div>
    <div id="rightDot"></div>
  </body>
</html>
