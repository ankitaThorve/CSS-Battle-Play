<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Battle - Forking Crazy</title>
    <style>
      body {
        background: #6592cf;
        display: flex;
        align-items: center;
        flex-direction: column-reverse;
      }
      div {
        background: #060f55;
      }
      #bottom {
        height: 50px;
        width: 20px;
      }
      #top {
        height: 200px;
        width: 140px;
        border-radius: 100px;
        background: linear-gradient(#6592cf 50%, #060f55 50%);
      }
      #top::before {
        content: "";
        display: block;
        width: 20px;
        height: 110px;
        background: #060f55;
        border-radius: 15px;
        box-shadow:
          #6592cf 20px 0px,
          #060f55 40px 0px,
          #6592cf 60px 0px,
          #060f55 80px 0px,
          #6592cf 100px 0px,
          #060f55 120px 0px;
      }
    </style>
  </head>
  <body>
    <div id="bottom"></div>
    <div id="top"></div>
  </body>
</html>
