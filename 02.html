<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-color: #62374e;
        padding: 50px;
        margin: 0;
        width: 400px;
        height: 300px;
      }
      div {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: space-between;
        align-content: space-between;
        flex-wrap: wrap;
      }

      div > p {
        width: 50px;
        height: 50px;
        margin: 0;
        flex-basis: 50%;
        display: flex;
      }
      p:after {
        content: "";
        width: 50px;
        height: 50px;
        display: flex;
        background: #fdc57b;
      }
      p:nth-child(even) {
        justify-content: flex-end;
      }
    </style>
  </head>
  <body>
    <div>
      <p>1</p>
      <p>2</p>
      <p>3</p>
      <p>4</p>
    </div>
  </body>
</html>
