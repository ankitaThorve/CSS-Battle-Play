<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Battle - Cloaked Spirits</title>
    <style>
      body {
        background: #62306d;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: end;
        height: 100vh;
      }
      div {
        width: 100px;
        height: 150px;
        background: #f7ec7d;
        border-radius: 50px 50px 0 0;
        position: relative;
      }
      #middle {
        height: 250px;
      }
      div::before {
        content: "";
        position: absolute;
        display: block;
        width: 100%;
        height: 101px;
        background: #e38f66;
        border-radius: 50%;
        box-shadow: inset 0 0 0 20px #aa445f;
      }
      #middle::before {
        background: #aa445f;
        box-shadow: inset 0 0 0 20px #e38f66;
      }
    </style>
  </head>
  <body>
    <div></div>
    <div id="middle"></div>
    <div></div>
  </body>
</html>
