<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Battle - Eye of the Tiger</title>
    <style>
      * {
        margin: 0;
        background: #0b2429;
      }
      body {
        display: grid;
        place-items: center;
      }
      p {
        position: absolute;
      }
      [c] {
        width: 50;
        height: 50;
        border-radius: 1in;
        border: 45px solid #F3AC3C;
        box-shadow: 0 0 0 20px #0B2429, 0 0 0 30px #998235;
      }
    </style>
  </head>
  <body>
    <p c>
      <!-- center circle -->
    </p>

    <p l>
      <!-- left triangle -->
    </p>

    <p r>
      <!-- right triangle -->
    </p>
  </body>
</html>
