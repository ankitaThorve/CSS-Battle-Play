<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Battle - Eye of Sauron</title>
    <style>
      body {
        background: #191210;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      div {
        background: #191210;
        border: 20px solid #eca03d;
        border-radius: 50px;
      }
      #middle {
        width: 100px;
        height: 100px;
        border: none;
        box-shadow: 0px 0px 0px 20px #eca03d;
        z-index: 1;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #dot {
        width: 50px;
        height: 50px;
        background: #84271c;
        border: none;
      }
      #left, #right{
        width: 60px;
        height: 60px;
        border-left-color: transparent;
        border-top-color: transparent;
      }
      #left{
        transform: rotate(45deg);
      }
      #right{
        transform: rotate(-135deg);
      }
    </style>
  </head>
  <body>
    <div id="left"></div>
    <div id="middle">
      <div id="dot"></div>
    </div>
    <div id="right"></div>
  </body>
</html>
